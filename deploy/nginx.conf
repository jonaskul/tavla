# One origin for both the app and the API.
#
# This is what keeps the session cookie on SameSite=Lax with no CORS at all:
# the browser never makes a cross-origin request, so there is nothing to
# permit and nothing to weaken. Leave CORS_ORIGINS empty when using this.
#
#   frontend  npm run build  ->  frontend/dist  ->  /var/www/tavla
#   API       the Dockerfile, listening on 127.0.0.1:8000

# Behind Cloudflare's proxy, every request arrives from Cloudflare, so the
# address nginx sees is theirs and not the visitor's. The sign-in endpoint
# rate limits per IP, so without this the whole internet counts as one
# caller and the eleventh sign-in in an hour is refused for everybody.
#
# CF-Connecting-IP is the visitor. Trust it only from Cloudflare's own
# ranges, or anyone could forge it and walk past the rate limit entirely.
# The list changes; refresh it from https://www.cloudflare.com/ips/
# (a small cron writing this file and reloading nginx is the usual way).
#
#   set_real_ip_from 173.245.48.0/20;
#   set_real_ip_from 103.21.244.0/22;
#   ... the rest of https://www.cloudflare.com/ips-v4 and ips-v6
#   real_ip_header CF-Connecting-IP;
#
# Not proxying through Cloudflare? Delete this block and the app sees the
# real address directly.

server {
    listen 443 ssl http2;
    server_name tavla.digibygg.io;

    # Let's Encrypt, or a Cloudflare Origin Certificate when proxied. With
    # the latter, set Cloudflare's SSL mode to Full (strict) — "Flexible"
    # makes Cloudflare talk plain HTTP to the origin, which means the
    # session cookie crosses that hop unencrypted despite the padlock the
    # visitor sees.
    ssl_certificate     /etc/letsencrypt/live/tavla.digibygg.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tavla.digibygg.io/privkey.pem;

    root /var/www/tavla;
    index index.html;

    # Uploads are capped here as well as in the application. The app reads a
    # request into memory before it checks the size, so on a small instance a
    # large POST is an out-of-memory kill; rejecting it at the edge means it
    # never reaches Python at all. Keep this in step with MAX_FILE_SIZE.
    client_max_body_size 20m;

    # Browsers guess content types from the bytes when this is absent, which
    # turns an upload that lies about being a JPEG into whatever it really is.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The sign-in endpoint rate limits per IP. Sending this is only
        # half the job: uvicorn ignores it unless the connection comes from
        # an address in FORWARDED_ALLOW_IPS, which defaults to 127.0.0.1.
        # Run the API in a container and it arrives from the docker bridge
        # instead, the header is dropped, every caller looks like the proxy,
        # and the eleventh sign-in in an hour is silently refused — for
        # everybody. See .env.example.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The update stream is server-sent events. Buffering would hold the
        # whole thing back until the run finished, so the page would sit
        # blank and then show every step at once. routers/system.py also
        # sends X-Accel-Buffering: no, which nginx honours; this is the
        # belt to that pair of braces.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Vite fingerprints these, so a new build is a new filename and this can
    # be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a browser keeps loading the old one
    # and asking for asset filenames that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /anlegg/3 is a route, not a file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name tavla.digibygg.io;
    return 301 https://$host$request_uri;
}
