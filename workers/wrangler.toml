name = "tavla"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The database. Locally this is a file miniflare manages; the real
# database_id goes here once the D1 instance exists.
[[d1_databases]]
binding = "DB"
database_name = "tavla"
database_id = "local"
migrations_dir = "migrations"

# Uploaded photos and PDFs. A binding rather than an S3 client, which is
# the one place Workers is simpler than the Python side.
[[r2_buckets]]
binding = "FILES"
bucket_name = "tavla-filer"

# Frontenden, servert av den samme workeren.
#
# Alternativet var et eget Pages-prosjekt og ruting mellom to tjenester
# under ett domene. Dette er én konfigblokk i stedet, og det løser
# samtidig dyplenkene: uten SPA-fallback virker navigasjon inne i appen,
# men en oppdatering av /anlegg/1 gir 404 — som aldri er siden man tester
# for hånd.
#
# Same-origin er dessuten det som lar sesjonscookien bli stående på
# SameSite=Lax. En frontend på ett domene og et API på et annet ville
# krevd SameSite=None, som er nøyaktig den beskyttelsen vi ikke vil gi
# fra oss.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Uten denne ville /api/... også endt som index.html. Workeren kjører
# først for API-et og bare der; alt annet serveres som fil, eller faller
# tilbake til appen.
run_worker_first = ["/api/*"]

# Denne fila beskriver produksjon.
#
# Med vilje den veien: en glemt flaggverdi skal gi det strengeste
# oppsettet, ikke det slappeste. Lokal utvikling overstyrer i .dev.vars,
# som ikke er committet — så det er utviklingsoppsettet som krever et
# bevisst valg, ikke produksjonsoppsettet.
[vars]
TAVLA_ENV = "production"
AUTH_MODE = "session"

# Avsenderadressen. Ikke hemmelig, så den hører hjemme her. Uten både
# denne og RESEND_API_KEY skrives innloggingskodene til loggen i stedet
# for å sendes — se src/mail.ts.
AUTH_FROM_EMAIL = "tavla@tavla.digibygg.io"

# COOKIE_DOMAIN er bevisst ikke satt.
#
# Uten den blir sesjonscookien host-only: nettleseren sender den bare til
# tavla.digibygg.io, og ikke til noe annet under digibygg.io. Setter man
# domenet eksplisitt, gjelder cookien for alle subdomener — inkludert
# framtidige som ikke er Tavla. Host-only er strammere, og vi trenger
# ikke det andre.
#
# SameSite=Lax holder uansett, siden nettlesere regner «samme nettsted»
# ut fra registrerbart domene: appen og API-et er samme opphav her.

# Hemmeligheter settes med `wrangler secret put`, aldri her:
#   SESSION_SECRET, RESEND_API_KEY
